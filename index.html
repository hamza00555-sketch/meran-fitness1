<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- The design switch (src/design.js): if the old design was chosen,
         go there before anything loads. Same storage, same data. -->
    <script>try{if(localStorage.getItem('meran_design')==='classic')location.replace('/classic/')}catch(e){}</script>
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/meran-app-icon-transparent-512.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/assets/meran-app-icon-transparent-180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/meran-app-icon-transparent-180.png" />
    <!-- Pinch-zoom allowed: small text must be enlargeable (a11y). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مران" />
    <meta name="theme-color" content="#030404" />
    <!-- Fonts ship with the app (src/styles/tokens.css), no CDN. -->
    <link rel="preload" href="/fonts/meran-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/meran-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>مران | MERAN</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
